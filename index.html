<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مهامي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3a5f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c3a5f;
    --navy-dark:#16304f;
    --red:#b91c1c;
    --ink:#1f2328;
    --bg:#f4f5f7;
    --border:#e2e4e8;
    --muted:#8a8f98;
    --muted-light:#a7acb5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#cbd2db;border-radius:4px;}
  button{font-family:inherit;cursor:pointer;background:none;border:none;}
  input{font-family:inherit;}

  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:32px;height:32px;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;}
  .brand h1{font-size:15px;font-weight:700;color:var(--navy);margin:0;line-height:1;}
  .brand span{font-size:11px;color:var(--muted);}
  .btn-outline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--navy);border:1px solid rgba(28,58,95,.3);border-radius:8px;padding:7px 12px;transition:background .15s;}
  .btn-outline:hover{background:rgba(28,58,95,.05);}

  /* Layout */
  .main{flex:1;display:flex;overflow:hidden;}
  .list-pane{width:100%;max-width:380px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:#fff;}
  .detail-pane{flex:1;display:flex;flex-direction:column;}
  @media (max-width:768px){
    .list-pane{max-width:none;display:flex;}
    .list-pane.hide-mobile{display:none;}
    .detail-pane{display:none;}
    .detail-pane.show-mobile{display:flex;}
  }

  .input-row{padding:12px;border-bottom:1px solid var(--border);}
  .input-row input{width:100%;font-size:14px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;outline:none;transition:border-color .15s;}
  .input-row input:focus{border-color:var(--navy);}
  .input-row input::placeholder{color:#a7acb5;}

  .list-scroll{flex:1;overflow-y:auto;}
  .section-label{padding:12px 16px 4px;font-size:11px;font-weight:700;color:var(--muted);}
  .empty-note{padding:32px 16px;text-align:center;font-size:13px;color:var(--muted-light);}

  .task-row{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #f0f1f3;transition:background .15s;}
  .task-row:hover{background:var(--bg);}
  .task-row.active{background:rgba(28,58,95,.06);}
  .task-row.pinned{background:#fdf6e8;}
  .check-dot{flex-shrink:0;margin-top:2px;width:16px;height:16px;border-radius:50%;border:2px solid #c3c8d0;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
  .check-dot:hover{border-color:var(--navy);}
  .check-dot.done{background:var(--red);border-color:var(--red);}
  .task-title{font-size:13.5px;font-weight:700;line-height:1.35;color:var(--navy);word-break:break-word;}
  .task-title.done{color:var(--red);}
  .task-meta{font-size:10.5px;color:var(--muted-light);margin-top:2px;}
  .pin-btn{flex-shrink:0;margin-top:1px;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#c3c8d0;transition:color .15s,background .15s;}
  .pin-btn:hover{background:#eef0f2;color:var(--navy);}
  .pin-btn.pinned{color:#c8901c;}
  .pin-btn.pinned:hover{background:#f7ecd3;}

  .detail-empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted-light);}
  .detail-header{padding:16px 20px;background:#fff;border-bottom:1px solid var(--border);}
  .back-btn{display:none;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-bottom:8px;background:none;}
  @media (max-width:768px){.back-btn{display:flex;}}
  .detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .detail-title{font-size:17px;font-weight:700;color:var(--navy);word-break:break-word;margin:0;}
  .detail-title.done{color:var(--red);}
  .detail-sub{font-size:11px;color:var(--muted);margin-top:4px;}
  .finish-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:8px;padding:7px 12px;border:1px solid rgba(28,58,95,.4);color:var(--navy);transition:background .15s;}
  .finish-btn.done{border-color:rgba(185,28,28,.4);color:var(--red);}
  .delete-link{font-size:11px;color:var(--muted-light);margin-top:8px;display:inline-block;}
  .delete-link:hover{color:var(--red);}

  .steps-scroll{flex:1;overflow-y:auto;padding:16px 20px;}
  .timeline{position:relative;}
  .timeline::before{content:'';position:absolute;top:4px;bottom:4px;right:5px;width:1.5px;background:var(--border);}
  .step-item{position:relative;padding-right:24px;padding-bottom:16px;}
  .step-item:last-child{padding-bottom:0;}
  .step-dot{position:absolute;right:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 4px #fff;}
  .step-text{font-size:14px;line-height:1.5;color:var(--ink);}
  .step-date{font-size:11px;color:var(--muted);margin-top:2px;}

  .step-input-row{padding:12px;border-top:1px solid var(--border);background:#fff;display:flex;gap:8px;}
  .step-input-row input{flex:1;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;outline:none;}
  .step-input-row input:focus{border-color:var(--navy);}
  .add-step-btn{flex-shrink:0;width:36px;height:36px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .add-step-btn:hover{background:var(--navy-dark);}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-overlay.hidden{display:none;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
  .modal-header h3{font-size:15px;font-weight:700;color:var(--navy);margin:0;}
  .modal-body{padding:16px;overflow-y:auto;flex:1;}
  .field-label{font-size:12px;font-weight:700;margin-bottom:8px;}
  .date-row{display:flex;gap:8px;margin-bottom:16px;}
  .date-field{flex:1;}
  .date-field label{font-size:10px;color:var(--muted);}
  .date-field input{width:100%;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;outline:none;}
  .task-checklist{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;}
  .task-check-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 4px;border-radius:6px;cursor:pointer;}
  .task-check-item:hover{background:var(--bg);}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px;}
  .modal-footer{padding:12px 16px;border-top:1px solid var(--border);}
  .download-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;font-size:13px;font-weight:500;border-radius:8px;padding:11px;transition:background .15s;}
  .download-btn:hover{background:var(--navy-dark);}

  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:8px 16px;border-radius:8px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>مهامي</h1>
        <span id="statusText">جارٍ التحميل...</span>
      </div>
    </div>
    <button class="btn-outline" onclick="openExport()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      تصدير تقرير
    </button>
  </div>

  <div class="main">
    <div class="list-pane" id="listPane">
      <div class="input-row">
        <input id="newTaskInput" placeholder="اكتب مهمة جديدة واضغط Enter..." onkeydown="if(event.key==='Enter')addTask()">
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </div>

    <div class="detail-pane" id="detailPane">
      <div class="detail-empty" id="detailEmpty">اختر مهمة من القائمة لعرض خطواتها</div>
      <div id="detailContent" style="display:none;flex-direction:column;height:100%;">
        <div class="detail-header">
          <button class="back-btn" onclick="selectTask(null)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m0 0l6-6m-6 6l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            رجوع للمهام
          </button>
          <div class="detail-top">
            <div style="min-width:0;">
              <h2 class="detail-title" id="detailTitle"></h2>
              <div class="detail-sub" id="detailSub"></div>
            </div>
            <button class="finish-btn" id="finishBtn" onclick="toggleComplete(currentTaskId)"></button>
          </div>
          <button class="delete-link" onclick="deleteTask(currentTaskId)">حذف المهمة نهائيًا</button>
        </div>
        <div class="steps-scroll" id="stepsScroll"></div>
        <div class="step-input-row">
          <input id="newStepInput" placeholder="سجّل خطوة جديدة واضغط Enter..." onkeydown="if(event.key==='Enter')addStep()">
          <button class="add-step-btn" onclick="addStep()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14m-7-7h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="exportModal">
  <div class="modal">
    <div class="modal-header">
      <h3>تصدير تقرير المهام</h3>
      <button onclick="closeExport()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#1f2328" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field-label">فلترة بالتاريخ (اختياري)</div>
      <div class="date-row">
        <div class="date-field"><label>من</label><input type="date" id="exportFrom"></div>
        <div class="date-field"><label>إلى</label><input type="date" id="exportTo"></div>
      </div>
      <div class="field-label">أو اختر مهام محددة (يلغي فلتر التاريخ)</div>
      <div class="task-checklist" id="exportChecklist"></div>
      <div class="hint">بدون أي فلترة أو اختيار، سيتم تصدير كل المهام.</div>
    </div>
    <div class="modal-footer">
      <button class="download-btn" onclick="downloadReport()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        تحميل التقرير
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== ضع رابط تطبيق Google Apps Script الخاص بك هنا بعد النشر ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbyfwQLjs3nXrNjtmXcK9Jg1S8zCbiT_koGJk6kjE5MN5_mtjpNpVGe47HHL_8MbxkWS/exec";
/* ===================================================================== */

let tasks = [];
let currentTaskId = null;
let exportSelected = new Set();

function pad(n){return String(n).padStart(2,'0');}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} - ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDateOnly(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function setStatus(text){
  document.getElementById('statusText').textContent = text;
}

/* ---------- API ---------- */
async function apiGet(action, params={}){
  const q = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(`${API_URL}?${q}`);
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function loadTasks(){
  if(API_URL.includes('PASTE_YOUR_WEB_APP_URL')){
    setStatus('لم يتم ربط الباك إند بعد');
    showToast('من فضلك ضع رابط Apps Script في متغير API_URL');
    return;
  }
  setStatus('جارٍ التحميل...');
  try{
    const data = await apiGet('getAll');
    if(data.error) throw new Error(data.error);
    tasks = (data.tasks||[]).map(t=>({
      id: t.taskId, text: t.text, createdAt: t.createdAt,
      completed: t.completed===true || t.completed==='TRUE',
      completedAt: t.completedAt || null,
      pinned: t.pinned===true || t.pinned==='TRUE',
      steps: (t.steps||[]).map(s=>({id:s.stepId, text:s.text, date:s.date}))
    }));
    setStatus('محدّث');
    renderList();
  }catch(e){
    setStatus('تعذّر تحميل البيانات');
    showToast('حصل خطأ في الاتصال بالسيرفر');
  }
}

/* ---------- Actions ---------- */
async function addTask(){
  const input = document.getElementById('newTaskInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  setStatus('جارٍ الحفظ...');
  const res = await apiPost({action:'addTask', text});
  if(res.error){ showToast('تعذّر إضافة المهمة'); setStatus('محدّث'); return; }
  tasks.unshift({id:res.taskId, text, createdAt:res.createdAt, completed:false, completedAt:null, pinned:false, steps:[]});
  setStatus('محدّث');
  renderList();
  selectTask(res.taskId);
}

async function toggleComplete(id){
  if(!id) return;
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  const prevCompleted = t.completed;
  t.completed = !t.completed;
  t.completedAt = t.completed ? new Date().toISOString() : null;
  renderList(); renderDetail();
  const res = await apiPost({action:'toggleComplete', taskId:id});
  if(res.error){ t.completed = prevCompleted; renderList(); renderDetail(); showToast('تعذّر تحديث الحالة'); }
}

async function togglePin(id){
  if(!id) return;
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  const prevPinned = t.pinned;
  t.pinned = !t.pinned;
  renderList(); renderDetail();
  const res = await apiPost({action:'togglePin', taskId:id});
  if(res.error){ t.pinned = prevPinned; renderList(); renderDetail(); showToast('تعذّر تثبيت المهمة'); }
}

async function addStep(){
  const input = document.getElementById('newStepInput');
  const text = input.value.trim();
  if(!text || !currentTaskId) return;
  input.value = '';
  const t = tasks.find(t=>t.id===currentTaskId);
  const res = await apiPost({action:'addStep', taskId:currentTaskId, text});
  if(res.error){ showToast('تعذّر إضافة الخطوة'); return; }
  t.steps.push({id:res.stepId, text, date:res.date});
  renderList(); renderDetail();
}

async function deleteTask(id){
  if(!id) return;
  if(!confirm('تأكيد حذف المهمة نهائيًا؟')) return;
  const res = await apiPost({action:'deleteTask', taskId:id});
  if(res.error){ showToast('تعذّر حذف المهمة'); return; }
  tasks = tasks.filter(t=>t.id!==id);
  currentTaskId = null;
  renderList(); renderDetail();
}

function selectTask(id){
  currentTaskId = id;
  renderDetail();
  const listPane = document.getElementById('listPane');
  const detailPane = document.getElementById('detailPane');
  if(window.innerWidth <= 768){
    if(id){ listPane.classList.add('hide-mobile'); detailPane.classList.add('show-mobile'); }
    else{ listPane.classList.remove('hide-mobile'); detailPane.classList.remove('show-mobile'); }
  }
  renderList();
}

/* ---------- Render ---------- */
function renderList(){
  const pinned = tasks.filter(t=>!t.completed && t.pinned).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const active = tasks.filter(t=>!t.completed && !t.pinned).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const done = tasks.filter(t=>t.completed).sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
  const el = document.getElementById('listScroll');

  if(tasks.length===0){
    el.innerHTML = `<div class="empty-note">لا توجد مهام بعد. اكتب مهمتك الأولى بالأعلى.</div>`;
    return;
  }

  let html = '';
  if(pinned.length){
    html += `<div class="section-label">📌 مثبتة — ${pinned.length}</div>`;
    html += pinned.map(taskRowHtml).join('');
  }
  html += `<div class="section-label">قيد التنفيذ — ${active.length}</div>`;
  html += active.map(taskRowHtml).join('');
  if(done.length){
    html += `<div class="section-label">المهام المنفذة — ${done.length}</div>`;
    html += done.map(taskRowHtml).join('');
  }
  el.innerHTML = html;
}

function taskRowHtml(t){
  return `
  <div class="task-row ${t.id===currentTaskId?'active':''} ${t.pinned?'pinned':''}" onclick="selectTask('${t.id}')">
    <button class="check-dot ${t.completed?'done':''}" onclick="event.stopPropagation();toggleComplete('${t.id}')">
      ${t.completed?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
    </button>
    <div style="min-width:0;flex:1;">
      <div class="task-title ${t.completed?'done':''}">${escapeHtml(t.text)}</div>
      <div class="task-meta">${fmtDateOnly(t.createdAt)}${t.steps.length?' · '+t.steps.length+' خطوة':''}</div>
    </div>
    <button class="pin-btn ${t.pinned?'pinned':''}" onclick="event.stopPropagation();togglePin('${t.id}')" title="${t.pinned?'إلغاء التثبيت':'تثبيت المهمة'}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="${t.pinned?'currentColor':'none'}"><path d="M16 3l5 5-4 1-4 4 1 5-5-5-6 6v-2l6-6-5-5 5 1 4-4 1-4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
  </div>`;
}

function renderDetail(){
  const empty = document.getElementById('detailEmpty');
  const content = document.getElementById('detailContent');
  const t = tasks.find(t=>t.id===currentTaskId);
  if(!t){
    empty.style.display='flex';
    content.style.display='none';
    return;
  }
  empty.style.display='none';
  content.style.display='flex';

  document.getElementById('detailTitle').textContent = t.text;
  document.getElementById('detailTitle').className = 'detail-title' + (t.completed?' done':'');
  document.getElementById('detailSub').textContent = `أُنشئت في ${fmtDateTime(t.createdAt)}` + (t.completed? ` · انتهت في ${fmtDateTime(t.completedAt)}` : '');

  const btn = document.getElementById('finishBtn');
  btn.className = 'finish-btn' + (t.completed?' done':'');
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>${t.completed?'إلغاء الإنهاء':'إنهاء المهمة'}`;

  const stepsEl = document.getElementById('stepsScroll');
  if(t.steps.length===0){
    stepsEl.innerHTML = `<div class="empty-note">لا توجد خطوات مسجلة بعد</div>`;
  }else{
    stepsEl.innerHTML = `<div class="timeline">` + t.steps.map(s=>`
      <div class="step-item">
        <div class="step-dot"></div>
        <div class="step-text">${escapeHtml(s.text)}</div>
        <div class="step-date">${fmtDateTime(s.date)}</div>
      </div>`).join('') + `</div>`;
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- Export ---------- */
function openExport(){
  exportSelected = new Set();
  document.getElementById('exportFrom').value='';
  document.getElementById('exportTo').value='';
  const list = document.getElementById('exportChecklist');
  const sorted = [...tasks].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(sorted.length===0){
    list.innerHTML = `<div style="font-size:12px;color:var(--muted-light);">لا توجد مهام</div>`;
  }else{
    list.innerHTML = sorted.map(t=>`
      <label class="task-check-item">
        <input type="checkbox" onchange="toggleExportSelect('${t.id}')">
        <span style="color:${t.completed?'var(--red)':'var(--navy)'}">${escapeHtml(t.text)}</span>
      </label>`).join('');
  }
  document.getElementById('exportModal').classList.remove('hidden');
}
function closeExport(){
  document.getElementById('exportModal').classList.add('hidden');
}
function toggleExportSelect(id){
  if(exportSelected.has(id)) exportSelected.delete(id);
  else exportSelected.add(id);
}
function buildReport(){
  const from = document.getElementById('exportFrom').value;
  const to = document.getElementById('exportTo').value;
  let pool = tasks;
  if(exportSelected.size>0){
    pool = tasks.filter(t=>exportSelected.has(t.id));
  }else if(from || to){
    const fromD = from? new Date(from+'T00:00:00') : null;
    const toD = to? new Date(to+'T23:59:59') : null;
    pool = tasks.filter(t=>{
      const d = new Date(t.createdAt);
      if(fromD && d<fromD) return false;
      if(toD && d>toD) return false;
      return true;
    });
  }
  pool = [...pool].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  const lines = [];
  lines.push('تقرير المهام');
  lines.push(`تاريخ التصدير: ${fmtDateTime(new Date().toISOString())}`);
  lines.push(`عدد المهام: ${pool.length}`);
  lines.push('='.repeat(50));
  lines.push('');
  if(pool.length===0) lines.push('لا توجد مهام مطابقة.');

  pool.forEach((t,idx)=>{
    lines.push(`${idx+1}. ${t.text}`);
    lines.push(`   الحالة: ${t.completed?'منتهية':'قيد التنفيذ'}`);
    lines.push(`   تاريخ الإنشاء: ${fmtDateTime(t.createdAt)}`);
    if(t.completed && t.completedAt) lines.push(`   تاريخ الانتهاء: ${fmtDateTime(t.completedAt)}`);
    if(t.steps.length===0){
      lines.push('   الخطوات: لا توجد خطوات مسجلة');
    }else{
      lines.push('   الخطوات:');
      t.steps.forEach(s=>lines.push(`     - [${fmtDateTime(s.date)}] ${s.text}`));
    }
    lines.push('');
  });
  return lines.join('\n');
}
function downloadReport(){
  const content = buildReport();
  const blob = new Blob(['\uFEFF'+content], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `تقرير_المهام_${fmtDateOnly(new Date().toISOString()).replace(/\//g,'-')}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeExport();
}

/* ---------- Init ---------- */
window.addEventListener('resize', ()=>{
  if(window.innerWidth > 768){
    document.getElementById('listPane').classList.remove('hide-mobile');
    document.getElementById('detailPane').classList.remove('show-mobile');
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

loadTasks();
</script>
